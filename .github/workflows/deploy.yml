name: Deploy VitePress site to Pages

on:
  push:
    branches: [master] # 根据你的默认分支名调整，如 master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 获取完整历史，用于生成 lastUpdated 等信息

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          version: 11          # 你的 pnpm 版本
          runtime: node@24     # 同时安装 Node 24
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0 # 确保使用 lockfile 中的精确版本。pnpm 11 的供应链安全策略 minimumReleaseAge：它默认会拒绝使用“发布时间太短”的包，防止刚被投毒的新版本被立即拉取

      - name: Build with VitePress
        run: pnpm run docs:build # 或你的实际构建命令

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4